<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker News Tech Radar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; }
        h1 { color: #ff6600; }
        .date { color: #666; font-size: 0.9em; }
        .topic { background: #f6f6ef; border-left: 4px solid #ff6600; padding: 15px; margin: 20px 0; }
        .topic h3 { margin-top: 0; color: #222; }
        .meta { font-size: 0.85em; color: #555; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Hacker News Tech Radar</h1>
    <p class="date">Daily intelligence research covering AI, cybersecurity, cloud, and DevOps from Hacker News.</p>
    <div id="content">Loading latest report...</div>
    <script>
        fetch('data/hn-tech-radar/latest.json')
            .then(res => res.json())
            .then(data => {
                let html = `<h2>Report Date: ${data.publicationDate || data.researchDate}</h2>`;
                html += `<p><em>${data.summary || ''}</em></p>`;
                html += `<h3>Biggest Discussions</h3>`;
                if (data.biggestDiscussions) {
                    data.biggestDiscussions.forEach(t => {
                        html += `<div class="topic">`;
                        html += `<h3>${t.title} (${t.category || t.area || 'Tech'})</h3>`;
                        html += `<p>${t.shortSummary || t.whatPeopleAreDiscussing || ''}</p>`;
                        html += `<p><strong>Why it matters:</strong> ${t.whyItMatters || ''}</p>`;
                        if (t.evidence) {
                            html += `<div class="meta">Evidence: <a href="${Array.isArray(t.evidence) ? t.evidence[0] : t.evidence}" target="_blank">Link</a></div>`;
                        }
                        html += `</div>`;
                    });
                }
                document.getElementById('content').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<p>Report data loading...</p>';
            });
    </script>
</body>
</html>
